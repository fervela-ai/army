<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- SEO：title 是唯一影響排名的那個（description 只決定搜尋結果的摘要長怎樣）。
     「線上版」「打開就能玩」「不用下載」是長尾關鍵字，也正是贏得過 App Store 的地方。 -->
<title>四國軍棋 線上版｜四人暗棋，打開就能玩</title>
<meta name="description" content="四個人兩兩一隊的軍棋，對家是你的隊友但你看不到他的棋子。可以一個人對三家電腦，不用下載、不用註冊、免費。">
<link rel="canonical" href="https://army.fervela.ai/ui/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://army.fervela.ai/ui/">
<meta property="og:title" content="四國軍棋 線上版｜四人暗棋，打開就能玩">
<meta property="og:description" content="四個人，兩兩一隊。對家是你的隊友，但你看不到他的棋子。打開就能玩，不用下載、不用註冊。">

<link rel="stylesheet" href="theme.css?v=237">
<!-- 網站人次（T010，營運長 10/15）：Cloudflare 網站分析，不用 Cookie、不送網址參數；寫法照營運長給的一字不差 -->
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"433e064bb2644552aaedad8b05834a93","spa":false}'></script>
</head>
<body>
<!-- 棋子的漸層：只是顏料，沒有任何遊戲意義。棋盤是 board.js 畫的，
     它只給每顆棋子 class；填什麼顏色由 theme.css 決定，這裡放的是 theme.css 引用的漸層。
     stop-color 用 CSS 變數，所以改隊色只要改 theme.css 一個地方。 -->
<svg id="paint-defs" width="0" height="0" aria-hidden="true" focusable="false"
     style="position:absolute; pointer-events:none"><defs>
  <linearGradient id="faceWood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fffdf4"/><stop offset="1" stop-color="#ead9ba"/>
  </linearGradient>
  <linearGradient id="face0" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fffdf4" style="stop-color:color-mix(in srgb, var(--seat-0) 6%, #fffefa)"/>
    <stop offset="1" stop-color="#dfe6f4" style="stop-color:color-mix(in srgb, var(--seat-0) 16%, #f4ead6)"/>
  </linearGradient>
  <linearGradient id="face1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fffdf4" style="stop-color:color-mix(in srgb, var(--seat-1) 6%, #fffefa)"/>
    <stop offset="1" stop-color="#dcecdf" style="stop-color:color-mix(in srgb, var(--seat-1) 16%, #f4ead6)"/>
  </linearGradient>
  <linearGradient id="face2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fffdf4" style="stop-color:color-mix(in srgb, var(--seat-2) 6%, #fffefa)"/>
    <stop offset="1" stop-color="#f4dcd6" style="stop-color:color-mix(in srgb, var(--seat-2) 16%, #f4ead6)"/>
  </linearGradient>
  <linearGradient id="face3" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fffdf4" style="stop-color:color-mix(in srgb, var(--seat-3) 6%, #fffefa)"/>
    <stop offset="1" stop-color="#f3e6c8" style="stop-color:color-mix(in srgb, var(--seat-3) 16%, #f4ead6)"/>
  </linearGradient>
  <linearGradient id="hide0" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5b8bf0" style="stop-color:color-mix(in srgb, var(--seat-0) 78%, #ffffff)"/>
    <stop offset="1" stop-color="#1d4fbf" style="stop-color:color-mix(in srgb, var(--seat-0) 82%, #000000)"/>
  </linearGradient>
  <linearGradient id="hide1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4cc178" style="stop-color:color-mix(in srgb, var(--seat-1) 78%, #ffffff)"/>
    <stop offset="1" stop-color="#0f7a37" style="stop-color:color-mix(in srgb, var(--seat-1) 82%, #000000)"/>
  </linearGradient>
  <linearGradient id="hide2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c86459" style="stop-color:color-mix(in srgb, var(--seat-2) 78%, #ffffff)"/>
    <stop offset="1" stop-color="#972e22" style="stop-color:color-mix(in srgb, var(--seat-2) 82%, #000000)"/>
  </linearGradient>
  <linearGradient id="hide3" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d5ac4c" style="stop-color:color-mix(in srgb, var(--seat-3) 78%, #ffffff)"/>
    <stop offset="1" stop-color="#a57914" style="stop-color:color-mix(in srgb, var(--seat-3) 82%, #000000)"/>
  </linearGradient>
</defs></svg>

<!-- 實驗中的棋路開關：用網址參數打開，預設關閉，朋友不受影響。
     例：?focus=8 ＝「集中打同一家」（量測見 engine/ai/ai.mjs 的 focusPull）。
     ⚠ 一定要放在這裡、用普通 script：模組（type=module）是延後執行的，
        寫在 app.js 裡會來不及——ai.mjs 在載入當下就讀走這個值了。 -->
<script>
  (function () {
    var f = Number(new URLSearchParams(location.search).get('focus'));
    if (isFinite(f) && f > 0) globalThis.__AI_W__ = { focusPull: f };
  })();
</script>

<!-- 進場畫面。Lynch 2026-09-05：「我希望我四國軍棋進場畫面也要是類似這樣好看的。」
     v234（B 款暖木，WO-army-1015-04）：背景改成 GPT 畫的棋館場景（img/home/bg-*.webp，
     由 theme.css 的 .landing 背景帶入），原本 board.js 斜擺畫的那盤棋拿掉——新背景圖桌上已經有一盤，
     兩盤疊在一起很怪。帶 ?room= 或 #lobby 進來的人會直接跳過這一頁。 -->
<div class="landing" id="landing" hidden>
  <div class="landing-inner">
    <div class="landing-top">
      <span class="landing-chip">四人暗棋 · 線上對戰</span>
      <h1 class="landing-title">四國軍棋</h1>
      <p class="landing-sub">你和對家一隊，拿下敵方兩面軍旗就贏。<br>和電腦隊友一隊對抗兩家電腦，或把連結丟給朋友。</p>
    </div>
    <!-- 手機上這段是空的：讓背景那張桌子露出來（卡片在下面） -->
    <div class="landing-gap" aria-hidden="true"></div>
    <div class="landing-cards">
      <!-- 卡片的 id 與點擊行為不要動（app.js 綁的是 id）；只換長相與圖示 -->
      <button class="landing-card landing-card--main" id="ldSolo">
        <img class="landing-card-icon" src="img/home/icon-start.webp?v=237" width="96" height="96" alt="">
        <span><b>開始遊戲</b><small>和電腦隊友一隊，對抗兩家電腦</small></span>
      </button>
      <button class="landing-card" id="ldOnline">
        <img class="landing-card-icon" src="img/home/icon-online.webp?v=237" width="96" height="96" alt="">
        <span><b>多人連線</b><small>邀請好友 · 雙人合作 / 雙人敵對 / 四人局</small></span>
      </button>
      <button class="landing-card" id="ldGuide">
        <img class="landing-card-icon" src="img/home/icon-guide.webp?v=237" width="96" height="96" alt="">
        <span><b>新手指南</b><small>沒玩過？三分鐘看懂怎麼玩</small></span>
      </button>
    </div>
    <div class="landing-meta">
      <p class="landing-foot">
        <button class="landing-name" id="ldRename" title="改代稱">你的代稱：<b id="ldName">—</b><span class="landing-name-edit">改</span></button>
      </p>
      <p class="landing-foot landing-stats" id="ldStats"></p>
      <div class="rating-note" id="ldRating">
        <img src="rating-general.png" width="48" height="48" alt="普遍級">
        <span>普遍級，任何年齡皆可玩。請注意使用時間，避免沉迷。<br>本遊戲不得用於賭博或從事違法行為。</span>
      </div>
      <p class="landing-foot landing-op">營運：Fervela.ai　<a href="mailto:contact@fervela.ai">contact@fervela.ai</a>　<span id="ldVer"></span></p>
    </div>
  </div>
</div>
<script>
// 首頁先自己打開，不等遊戲程式（10/16 Miles 手機 Brave：程式被擋或還在下載時，只看到一塊空棋盤）。
// 帶房號、#lobby 進來的人照舊不顯示首頁，交給 app.js。
// 看門狗：8 秒後程式還沒跑起來（例如被廣告阻擋擋掉一支檔），就在首頁說清楚怎麼辦。
(function () {
  var q = new URLSearchParams(location.search);
  var deep = location.hash.replace(/^#/, '') || q.get('room') || q.get('r');
  var ld = document.getElementById('landing');
  if (ld && !deep) ld.hidden = false;
  setTimeout(function () {
    if (window.__armyBooted || !ld) return;
    ld.hidden = false;
    var box = document.createElement('div');
    box.className = 'boot-fail';
    box.innerHTML = '<b>遊戲程式沒有載入完成。</b><br>如果你開了廣告阻擋（例如 Brave 的盾牌），請對 army.fervela.ai 關掉後重新整理；網路慢的話，稍等一下再重新整理。';
    var btn = document.createElement('button');
    btn.className = 'btn btn--primary';
    btn.textContent = '重新整理';
    btn.onclick = function () { location.reload(); };
    box.appendChild(btn);
    var inner = ld.querySelector('.landing-inner') || ld;
    inner.insertBefore(box, inner.firstChild);
  }, 8000);
})();
</script>
<div class="app">
  <header class="topbar">
    <!-- 標題就是回首頁的入口（Lynch：「這頁回不到首頁？」）。
         不另外加按鈕：頂欄在手機上已經很擠，多一顆就會換行、把棋盤往下推。 -->
    <h1 class="title"><button class="title-home" id="home" title="回首頁">四國軍棋</button></h1>
    <!-- 版本號要看得到：回報問題時才分得出他看的是哪一版（Lynch 要求）。
         內容由 tools/bump-ui-version.sh 改的 ?v= 帶進來，不必另外維護。 -->
    <span class="uiver" id="uiVer" title="介面版本"></span>
    <!-- 對局代號要留在畫面上：討論棋局時大家是丟截圖的，代號不在圖裡就對不上是哪一局 -->
    <div class="gamecode" id="gameCode" title="這一局的代號，回報問題時附上它">—</div>
    <div class="turn" id="turn">準備中</div>
    <div class="controls">
      <label class="toggle debug-tools" id="modeTools" hidden>模式
        <select id="mode">
          <option value="solo" selected>單人（三家電腦）</option>
          <option value="coop">雙人合作（兩人一隊打電腦）</option>
          <option value="duelAI">雙人敵對（各帶一個電腦隊友）</option>
          <option value="duelTeam">雙人敵對（各控一整隊）</option>
        </select>
      </label>
      <!-- 手機上這一排會擠成兩列，把棋盤往下推。低頻的功能（音效、棋盤大小、
           重新開局）收進「⋯」，常用的（規則說明、認輸離開）留在外面。
           桌機不受影響：.controls-more 在寬螢幕是 display:contents，照常排成一列。 -->
      <span class="debug-tools" id="debugTools" hidden>
        <label class="toggle"><input type="checkbox" id="useSearch"> 電腦用搜尋（實驗中，目前較弱）</label>
        <label class="toggle"><input type="checkbox" id="revealAll"> 顯示全部（除錯用）</label>
      </span>
      <button class="btn debug-tools" id="sfx" hidden>音效</button>
      <button class="btn side-toggle" id="sideBtn" aria-label="座位與戰報">戰報</button>
      <button class="btn controls-toggle" id="moreBtn" aria-label="更多設定">⋯</button>
      <div class="controls-more" id="moreBox">
        <button class="btn" id="online">多人連線</button>
        <button class="btn" id="guide">規則說明</button>
        <button class="btn" id="resign">認輸離開</button>
        <label class="toggle"><input type="checkbox" id="soundOn" checked> 音效</label>
        <button class="btn" id="restart">重新開局</button>
      </div>
    </div>
  </header>

  <div class="setupbar" id="setupbar" hidden>
    <span class="setup-who" id="setupWho"></span>
    <span class="setup-timer" id="setupTimer"></span>
    <span class="setup-hint" id="setupHint">點兩顆自己的棋子即可互換位置</span>
    <span class="setup-actions">
      <button class="btn" id="btnName">代稱</button>
      <button class="btn" id="btnRandom">隨機重排</button>
      <button class="btn" id="btnSave">儲存陣型</button>
      <button class="btn" id="btnLoad">讀取陣型</button>
      <button class="btn" id="btnOtherSeat" hidden>編輯我的另一家</button>
      <button class="btn btn--primary" id="btnConfirm">確定佈陣</button>
    </span>
  </div>

  <main class="stage">
    <svg class="board" id="board" xmlns="http://www.w3.org/2000/svg"></svg>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-card">
      <h3 class="modal-title" id="modalTitle"></h3>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <!-- 配對大廳與等人畫面（v232，B 款暖木棋館）：原本是彈出框，現在是蓋住整個視窗的滿版頁。
       背景是 GPT 畫的空桌場景圖（img/lobby/），四個座位是疊在椅子上的真按鈕，內容由 app.js 的
       renderLobby／openMatchLobby（經由 lbHead、lbSeat、lbFoot）填。z-index 比彈出框低，改代稱、規則說明、被請離座的提示照樣蓋在它上面。 -->
  <div class="lobby-page" id="lobbyPage" hidden></div>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay-card">
      <div class="overlay-emblem" id="overlayEmblem"></div>
      <h2 class="overlay-title" id="overlayTitle"></h2>
      <p class="overlay-sub" id="overlaySub"></p>
      <!-- 局名要出現在結算畫面：大家是丟截圖討論棋局的，代號不在圖裡就對不上是哪一局
           （Lynch：「勝利畫面希望也要秀出這局的名稱」）。 -->
      <p class="overlay-code" id="overlayCode"></p>
      <button class="btn btn--primary overlay-btn" id="overlayAgain">再玩一局</button>
    </div>
  </div>

  <aside class="side">
    <!-- 「換你囉」的橫幅（Lynch 要求）。不論輪到誰都佔一樣的高度——
         輪到別人時顯示「等 XX 出手」，所以它出現／消失不會推動下面的面板。 -->
    <div class="turnbanner" id="turnBanner"></div>
    <!-- 手機上座位與戰報收進「戰報」按鈕打開的面板，棋盤才不用跟它們搶一屏 -->
    <div class="side-sheet">
      <section class="panel">
        <h2 class="panel-title">座位</h2>
        <ul class="seats" id="seats"></ul>
      </section>
      <section class="panel">
        <h2 class="panel-title">戰報</h2>
        <ol class="log" id="log"></ol>
      </section>
    </div>
  </aside>
</div>
<script type="module" src="app.js?v=237"></script>
</body>
</html>
